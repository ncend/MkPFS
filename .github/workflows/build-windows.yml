name: Build Windows Executables

on:
  push:
    tags:
      - 'v*'
      - 'auto-*'
  workflow_dispatch:
  repository_dispatch:
    types: [auto-build]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv add pyinstaller

      - name: Build CLI executable
        run: |
          uv run pyinstaller --onefile --name mkpfs --console mkpfs/cli.py --icon assets/images/icon.png

      - name: Build GUI executable
        run: |
          uv run pyinstaller ./mkpfs-gui.spec --log-level=DEBUG

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkpfs-cli-windows
          path: dist/mkpfs.exe

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkpfs-gui-windows
          path: dist/mkpfs-gui.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/mkpfs.exe
            dist/mkpfs-gui.exe
          generate_release_notes: true